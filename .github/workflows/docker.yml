# Al publicar una versión (etiqueta vX.Y.Z o vX.Y.Z-beta.N) construye la imagen para amd64 y arm64 y la sube a Docker Hub.
# El mismo código vive en dos repositorios y cada uno publica SU imagen, según el nombre del repositorio:
#   …/PVEMon  → dagarines/pvemon  (edición PVEMon)
#   …/BCKMon  → dagarines/bckmon  (edición BCKMon, solo copias)
# Las versiones beta (con «-» en la etiqueta) NO actualizan «latest» ni la etiqueta mayor.menor: solo llevan su versión exacta.
# Necesita dos secretos en cada repositorio: DOCKERHUB_USERNAME (dagarines) y DOCKERHUB_TOKEN (token de acceso de Docker Hub con permiso de escritura).
name: Imagen Docker
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch: {}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        run: |
          repo="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          case "$repo" in
            */bckmon) echo 'matrix={"include":[{"edition":"bckmon","image":"dagarines/bckmon","title":"BCKMon"}]}' >> "$GITHUB_OUTPUT" ;;
            *)        echo 'matrix={"include":[{"edition":"pvemon","image":"dagarines/pvemon","title":"PVEMon"}]}' >> "$GITHUB_OUTPUT" ;;
          esac

  docker:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          # «latest» lo gestiona la propia acción: solo para versiones definitivas (no beta)
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          build-args: EDITION=${{ matrix.edition }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.edition }}
          cache-to: type=gha,mode=max,scope=${{ matrix.edition }}
