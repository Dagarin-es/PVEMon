# Al publicar una versión (etiqueta vX.Y.Z o vX.Y.Z-beta.N) construye las imágenes para amd64 y arm64 y las sube a Docker Hub:
#   dagarines/pvemon  (edición PVEMon)   y   dagarines/bckmon  (edición BCKMon, solo copias)
# Las versiones beta (con «-» en la etiqueta) NO actualizan «latest» ni la etiqueta mayor.menor: solo llevan su versión exacta.
# Necesita dos secretos en el repositorio: DOCKERHUB_USERNAME (dagarines) y DOCKERHUB_TOKEN (token de acceso de Docker Hub con permiso de escritura).
name: Imagen Docker
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch: {}

jobs:
  docker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: pvemon
            image: dagarines/pvemon
          - edition: bckmon
            image: dagarines/bckmon
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          # «latest» lo gestiona la propia acción: solo para versiones definitivas (no beta)
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=${{ matrix.edition == 'bckmon' && 'BCKMon' || 'PVEMon' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: EDITION=${{ matrix.edition }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.edition }}
          cache-to: type=gha,mode=max,scope=${{ matrix.edition }}
